# coturn — STUN/TURN server
listening-port=3478
tls-listening-port=5349

# Troque pelo IP público do servidor em produção
# external-ip=SEU_IP_PUBLICO

# Credenciais (devem bater com TURN_USERNAME e TURN_CREDENTIAL no .env)
user=nexus:nexus_turn_secret
realm=nexus.local

# Segurança
fingerprint
lt-cred-mech
no-multicast-peers
no-loopback-peers

# Logs
log-file=/var/log/coturn/turn.log
verbose

# Portas de relay UDP
min-port=49152
max-port=65535
