version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3 local) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexus_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MinIO setup (cria bucket automaticamente) ─────────────────
  minio_setup:
    image: minio/mc:latest
    container_name: nexus_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/nexus-uploads;
      mc anonymous set download local/nexus-uploads;
      echo 'MinIO setup OK';
      "
    restart: 'no'

  # ── LiveKit SFU ───────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: nexus_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # ATENÇÃO: o LiveKit precisa ser alcançável por rede para o WebRTC
    # funcionar (mídia). Em DEV local isso é aceitável. Se rodar num
    # servidor PÚBLICO, coloque o LiveKit atrás do proxy reverso com TLS
    # e troque a devkey/devsecret por chaves fortes (ver infra/livekit).
    ports:
      - '7880:7880'   # HTTP/WS
      - '7881:7881'   # RTC TCP
      - '50000-50020:50000-50020/udp'  # RTC UDP (media)
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7880/']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── coturn (STUN/TURN) ────────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: nexus_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

  # ── Mailhog (SMTP dev) ────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexus_mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'  # SMTP
      - '127.0.0.1:8025:8025'  # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
